[project]
name = "gatepulse"
version = "0.1.0"
description = "High-throughput API Gateway & Smart Reverse Proxy"
authors = [
    {name = "Maximus Champion",email = "maximuschampion2002@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi (>=0.162.4,<0.163.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "scalar-fastapi (>=1.9.1,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
